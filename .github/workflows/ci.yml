name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}${{ github.ref_name == 'main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build-perl:
    name: Build Perl (PR Test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy-endpoint: ${{ vars.BB_ENDPOINT }}
          buildbuddy-api-key: ${{ secrets.BB_API_KEY }}

      - name: Verify repository structure and platforms
        run: |
          INVOCATION_ID=$(uuidgen)
          echo "Invocation ID: ${INVOCATION_ID}"
          bazel query --invocation_id=${INVOCATION_ID} //...

      - name: Build Relocatable Perl Distributions (RBE)
        run: |
          INVOCATION_ID=$(uuidgen)
          echo "Invocation ID: ${INVOCATION_ID}"
          bazel build --invocation_id=${INVOCATION_ID} \
            --config=ci \
            --config=rbe \
            --remote_download_outputs=toplevel \
            //bazel/release:dist

      - name: Collect Distribution Archives
        run: |
          mkdir -p dist
          find -L bazel-out/ -name "perl-*.tar.*" -not -path "*/runfiles/*" -exec cp -L -f {} dist/ \;
          ls -la dist/
          test -f dist/perl-test-suite.tar.gz || (echo "Error: dist/perl-test-suite.tar.gz missing!" && exit 1)
          test -f dist/perl-*-linux_arm64.tar.gz || (echo "Error: Linux ARM64 tarball missing!" && exit 1)
          test -f dist/perl-*-linux_arm64-nopthread.tar.gz || (echo "Error: Linux ARM64 nopthread tarball missing!" && exit 1)
          test -f dist/perl-*-osx_arm64.tar.gz || (echo "Error: macOS ARM64 tarball missing!" && exit 1)
          test -f dist/perl-*-osx_arm64-nopthread.tar.gz || (echo "Error: macOS ARM64 nopthread tarball missing!" && exit 1)

      - name: Upload Distribution Archives
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: perl-dist-archives
          path: dist/*
          if-no-files-found: error

      - name: Run Miniperl Reproducibility Test
        run: |
          INVOCATION_ID=$(uuidgen)
          echo "Invocation ID: ${INVOCATION_ID}"
          bazel test --invocation_id=${INVOCATION_ID} \
            --config=ci \
            --config=rbe \
            --remote_download_outputs=toplevel \
            --test_output=all \
            //bazel/perl:miniperl_reproducibility_test

      - name: Run Relocatability & Verification Test (x86_64 Linux)
        run: |
          INVOCATION_ID=$(uuidgen)
          echo "Invocation ID: ${INVOCATION_ID}"
          bazel test --invocation_id=${INVOCATION_ID} \
            --config=ci \
            --config=rbe \
            --remote_download_outputs=toplevel \
            --test_output=all \
            //bazel/release:verify_dist_test \
            //bazel/release:verify_dist_nopthread_test

      - name: Run Upstream Unit Test Suite (x86_64 Linux RBE)
        run: |
          INVOCATION_ID=$(uuidgen)
          echo "Invocation ID: ${INVOCATION_ID}"
          bazel test --invocation_id=${INVOCATION_ID} \
            --config=ci \
            --config=rbe \
            --remote_download_outputs=toplevel \
            --test_output=all \
            //bazel/release:upstream_unit_test \
            //bazel/release:upstream_unit_nopthread_test

      - name: Run E2E Integration Smoke Test (rules_perl)
        run: |
          TARBALL=$(ls dist/perl-*-linux_amd64.tar.gz | head -n 1)
          chmod +x e2e/run_e2e_test.sh
          ./e2e/run_e2e_test.sh "${TARBALL}"

  validate-linux-arm64:
    name: Validate Cross-Compiled Perl on Linux ARM64
    needs: [build-perl]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Distribution Archives
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: perl-dist-archives
          path: dist

      - name: Validate Linux ARM64 Tarballs Relocatability
        run: |
          chmod +x bazel/release/verify_dist_test.sh
          TARBALL_PTHREAD=$(ls dist/perl-*-linux_arm64.tar.gz | head -n 1)
          TARBALL_NOPTHREAD=$(ls dist/perl-*-linux_arm64-nopthread.tar.gz | head -n 1)
          echo "Validating tarball (pthread): ${TARBALL_PTHREAD}"
          ./bazel/release/verify_dist_test.sh "${TARBALL_PTHREAD}"
          echo "Validating tarball (nopthread): ${TARBALL_NOPTHREAD}"
          ./bazel/release/verify_dist_test.sh "${TARBALL_NOPTHREAD}"

      - name: Run Upstream Unit Test Suite (Linux ARM64)
        run: |
          chmod +x bazel/release/run_upstream_tests.sh
          TEST_ARCHIVE="dist/perl-test-suite.tar.gz"
          TARBALL_PTHREAD=$(ls dist/perl-*-linux_arm64.tar.gz | head -n 1)
          TARBALL_NOPTHREAD=$(ls dist/perl-*-linux_arm64-nopthread.tar.gz | head -n 1)
          echo "Running tests against pthread distribution: ${TARBALL_PTHREAD}"
          ./bazel/release/run_upstream_tests.sh "${TARBALL_PTHREAD}" "${TEST_ARCHIVE}"
          echo "Running tests against nopthread distribution: ${TARBALL_NOPTHREAD}"
          ./bazel/release/run_upstream_tests.sh "${TARBALL_NOPTHREAD}" "${TEST_ARCHIVE}"

  validate-osx-arm64:
    name: Validate Cross-Compiled Perl on macOS ARM64
    needs: [build-perl]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Distribution Archives
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: perl-dist-archives
          path: dist

      - name: Validate macOS ARM64 Tarballs Relocatability
        run: |
          chmod +x bazel/release/verify_dist_test.sh
          TARBALL_PTHREAD=$(ls dist/perl-*-osx_arm64.tar.gz | head -n 1)
          TARBALL_NOPTHREAD=$(ls dist/perl-*-osx_arm64-nopthread.tar.gz | head -n 1)
          echo "Validating tarball (pthread): ${TARBALL_PTHREAD}"
          ./bazel/release/verify_dist_test.sh "${TARBALL_PTHREAD}"
          echo "Validating tarball (nopthread): ${TARBALL_NOPTHREAD}"
          ./bazel/release/verify_dist_test.sh "${TARBALL_NOPTHREAD}"

      - name: Run Upstream Unit Test Suite (macOS ARM64)
        run: |
          chmod +x bazel/release/run_upstream_tests.sh
          TEST_ARCHIVE="dist/perl-test-suite.tar.gz"
          TARBALL_PTHREAD=$(ls dist/perl-*-osx_arm64.tar.gz | head -n 1)
          TARBALL_NOPTHREAD=$(ls dist/perl-*-osx_arm64-nopthread.tar.gz | head -n 1)
          echo "Running tests against pthread distribution: ${TARBALL_PTHREAD}"
          ./bazel/release/run_upstream_tests.sh "${TARBALL_PTHREAD}" "${TEST_ARCHIVE}"
          echo "Running tests against nopthread distribution: ${TARBALL_NOPTHREAD}"
          ./bazel/release/run_upstream_tests.sh "${TARBALL_NOPTHREAD}" "${TEST_ARCHIVE}"

