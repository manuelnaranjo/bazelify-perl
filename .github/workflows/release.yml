name: Release

on:
  push:
    tags:
      - "v5.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag to release (e.g. v5.44.0.1)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build & Release Perl Binaries
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy-endpoint: ${{ vars.BB_ENDPOINT }}
          buildbuddy-api-key: ${{ secrets.BB_API_KEY }}

      - name: Parse tag version
        id: parse_version
        run: |
          # Matches tags formatted like v5.44.0.1 -> PERL_VERSION=5.44.0, PKG_REVISION=1
          TAG_CLEAN="${TAG#v}"
          PERL_VERSION=$(echo "$TAG_CLEAN" | cut -d'.' -f1-3)
          PKG_REV=$(echo "$TAG_CLEAN" | cut -d'.' -f4)
          echo "PERL_VERSION=${PERL_VERSION}" >> $GITHUB_OUTPUT
          echo "PKG_REV=${PKG_REV}" >> $GITHUB_OUTPUT
          echo "Building Perl release ${PERL_VERSION} (package revision ${PKG_REV}) for tag ${TAG}"

      - name: Build Relocatable Perl Archives for Target Platforms (RBE)
        run: |
          mkdir -p dist
          INVOCATION_ID=$(uuidgen)
          echo "Invocation ID: ${INVOCATION_ID}"
          bazel build --invocation_id=${INVOCATION_ID} \
            --config=rbe \
            --remote_download_outputs=toplevel \
            //bazel/release:dist
          find -L bazel-out/ -name "perl-*.tar.*" -not -path "*/runfiles/*" -exec cp -L -f {} dist/ \;
          ls -la dist/
          test -f dist/perl-test-suite.tar.gz || (echo "Error: dist/perl-test-suite.tar.gz missing!" && exit 1)
          test -f dist/perl-*-linux_arm64.tar.gz || (echo "Error: Linux ARM64 tarball missing!" && exit 1)
          test -f dist/perl-*-linux_arm64-nopthread.tar.gz || (echo "Error: Linux ARM64 nopthread tarball missing!" && exit 1)
          test -f dist/perl-*-osx_arm64.tar.gz || (echo "Error: macOS ARM64 tarball missing!" && exit 1)
          test -f dist/perl-*-osx_arm64-nopthread.tar.gz || (echo "Error: macOS ARM64 nopthread tarball missing!" && exit 1)

      - name: Run E2E Integration Smoke Test (rules_perl)
        run: |
          TARBALL=$(ls dist/perl-*-linux_amd64.tar.gz | head -n 1)
          chmod +x e2e/run_e2e_test.sh
          ./e2e/run_e2e_test.sh "${TARBALL}"

      - name: Generate Checksums
        if: always()
        run: |
          if [ -d dist ] && [ "$(ls -A dist 2>/dev/null)" ]; then
            cd dist
            sha256sum perl-* > SHA256SUMS
            ls -la
          fi

      - name: Create GitHub Release and Upload Artifacts
        if: always()
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG }}
          name: Relocatable Perl ${{ env.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.xz
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
